<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Concept — Signature Architecture</title><style>

n{font-size:13px}.menu{position:fixed;z-index:3;inset:55px auto auto 0;background:#fff;padding:20px;box-shadow:0 8px 20px #0004;max-height:80vh;overflow:auto;display:none}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;background:#fff}.page a{color:var(--r)}@media(max-width:720px){.stage{padding:14px;min-height:calc(100vh - 120px)}.book{display:block}.page,.page:only-child{width:100%;min-height:65vh;aspect-ratio:auto;padding:9%}.page h1{font-size:31px}.page p{font-size:16px}.cols{grid-template-columns:1fr}.bar{font-size:12px}.bar button{padding:8px}}</style>
<div class="bar"><div class="brand">SM<em>A</em>RT CONCEPT <small> / SIGNATURE ARCHITECTURE</small></div><div><button onclick="menu.classList.toggle('open')">Sommaire</button></div></div><nav id="menu" class="menu"></nav><main class="stage"><div id="book" class="book"></div></main><div class="foot"><button onclick="step(-1)">← Précédent</button><span id="counter"></span><button onclick="step(1)">Suivant →</button></div>
<script>
const pages=[
['SIGNATURE ARCHITECTURE','L’art de concevoir. La maîtrise de réaliser.','Contractant général · Maîtrise d’œuvre<br>France · Maroc · Tunisie'],
['NOTRE APPROCHE','Un projet. Deux façons de le réussir.','<div class="cols"><div class="tile"><strong>INTÉGRAL</strong>Vous confiez à Smart Concept les travaux prévus au contrat.</div><div class="tile"><strong>PILOTAGE</strong>Vous signez les marchés de travaux avec les entreprises et nous confiez une mission de maîtrise d’œuvre.</div></div>'],
['CONTRACTANT GÉNÉRAL','Déléguez la réalisation.','<ul><li>Un contrat de travaux avec Smart Concept.</li><li>Un prix global défini selon le périmètre convenu.</li><li>Une organisation intégrée des entreprises.</li></ul>'],
['MAÎTRISE D’ŒUVRE','Gardez la main sur votre projet.','<ul><li>Choisissez et contractualisez avec vos entreprises.</li><li>Comparez les devis lot par lot.</li><li>Bénéficiez de notre expertise et de notre suivi selon la mission confiée.</li></ul>'],
['LES AVANTAGES','Pourquoi choisir un maître d’œuvre ?','<div class="cols"><div class="tile"><strong>TRANSPARENCE</strong>Devis et factures directement accessibles.</div><div class="tile"><strong>LIBERTÉ</strong>Choix des entreprises et arbitrages conservés.</div><div class="tile"><strong>SOUPLESSE</strong>Mise en concurrence des offres.</div><div class="tile"><strong>EXPERTISE</strong>Un professionnel pour concevoir et coordonner.</div></div>'],
['LE COMPARATIF','Qui signe ? Qui facture ?','<p><b>Contractant général :</b> Smart Concept facture les travaux et répond des prestations qui lui sont confiées.</p><p><b>Maîtrise d’œuvre :</b> les entreprises facturent directement le client ; chaque intervenant répond de ses obligations.</p>'],
['NOTRE MÉTHODE','De l’idée à la réception.','<p>01 — Comprendre vos besoins.</p><p>02 — Étudier et préparer votre projet.</p><p>03 — Organiser les interventions.</p><p>04 — Suivre les travaux et assister à la réception, selon mission.</p>'],
['EXEMPLE ILLUSTRATIF','Un budget, deux organisations.','<p><b>150 000 € HT</b> de prix global contractuel en contractant général.</p><p>En maîtrise d’œuvre : <b>135 000 € HT</b> de marchés de travaux + <b>15 000 € HT</b> d’honoraires, soit un budget prévisionnel de 150 000 € HT.</p><small>Simulation non contractuelle.</small>'],
['NOTRE VALEUR','Une exigence commune.','<ul><li>Une méthode de travail structurée.</li><li>Une vision technique du projet.</li><li>Des étapes et des responsabilités clarifiées.</li><li>Un accompagnement adapté à vos attentes.</li></ul>'],
['NOTRE PRÉSENCE','France · Maroc · Tunisie','<div class="cols"><div class="tile"><strong>FRANCE</strong>Construction, rénovation et accompagnement.</div><div class="tile"><strong>MAROC</strong>Présence du réseau et coordination selon les implantations.</div><div class="tile"><strong>TUNISIE</strong>Relais local et accompagnement selon prestations disponibles.</div></div>'],
['VOTRE CHOIX','Quelle formule est faite pour vous ?','<p><b>Vous souhaitez déléguer les travaux ?</b><br>Privilégiez le contractant général.</p><p><b>Vous souhaitez choisir vos entreprises ?</b><br>Privilégiez la maîtrise d’œuvre.</p>'],
['CONTACT','Donnons vie à votre projet.','<p>Parlons de vos objectifs, de votre budget et du niveau d’accompagnement souhaité.</p><p><a href="mailto:contact@groupesmartconcept.com">contact@groupesmartconcept.com</a></p>']
];let pos=0;const book=document.getElementById('book'),counter=document.getElementById('counter'),menu=document.getElementById('menu');
function render(){let mobile=innerWidth<720;let ids=mobile?[pos]:[pos,pos+1].filter(i=>i<pages.length);book.innerHTML=ids.map(i=>'<article class="page '+(i===0?'hero':'')+'"><div class="kicker">'+pages[i][0]+'</div><div class="red"></div><h1>'+pages[i][1]+'</h1><div>'+pages[i][2]+'</div><div class="number">'+String(i+1).padStart(2,'0')+' / 12</div></article>').join('');counter.textContent=(ids[0]+1)+(ids.length>1?'–'+(ids[1]+1):'')+' / 12'}
function step(n){pos=Math.max(0,Math.min(11,pos+n*(innerWidth<720?1:2)));render()}onresize=render;onkeydown=e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)};menu.innerHTML=pages.map((a,i)=>'<button onclick="pos='+i+';render();menu.classList.remove(\'open\')">'+String(i+1).padStart(2,'0')+' — '+a[0]+'</button>').join('');render();
</script></html>
