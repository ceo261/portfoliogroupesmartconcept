<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Concept — Signature Architecture</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--red:#c60022;--ink:#1d2022;--cream:#f8f7f4}*{box-sizing:border-box}body{margin:0;background:#e8e7e3;color:var(--ink);font-family:"DM Sans",Arial,sans-serif;overflow-x:hidden}header{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,65px);border-bottom:1px solid #ddd}header .brand{font:800 19px Manrope;letter-spacing:.07em}header .brand b{color:var(--red)}header .sub{font-size:11px;letter-spacing:.2em;color:#777;text-transform:uppercase}.viewer{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;padding:24px 60px}.book{width:min(1080px,100%);height:min(680px,calc(100vh - 215px));min-height:450px;position:relative;perspective:2200px;filter:drop-shadow(0 24px 28px #0002)}.sheet{position:absolute;top:0;bottom:0;width:50%;background:white;overflow:hidden;backface-visibility:hidden;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.15,1),opacity .6s;box-shadow:0 0 1px #aaa}.sheet.left{left:0;transform-origin:right center;border-radius:2px 0 0 2px}.sheet.right{right:0;transform-origin:left center;border-radius:0 2px 2px 0}.sheet.turn-left{transform:rotateY(-180deg);opacity:.3}.sheet.turn-right{transform:rotateY(180deg);opacity:.3}.sheet.left:after,.sheet.right:after{content:"";position:absolute;top:0;bottom:0;width:35px;pointer-events:none}.sheet.left:after{right:0;background:linear-gradient(90deg,transparent,#00000012)}.sheet.right:after{left:0;background:linear-gradient(90deg,#00000012,transparent)}.inside{height:100%;display:flex;flex-direction:column;padding:clamp(28px,5%,55px);position:relative;background:var(--cream)}.inside.dark{background:#222527;color:#fff}.inside.photo{background:linear-gradient(140deg,#e2e1db 0%,#f7f6f2 48%,#b9b9b2 100%)}.inside:before{content:"";height:4px;width:62px;background:var(--red);position:absolute;top:35px;left:8%}.kicker{margin-top:55px;font-size:11px;font-weight:700;letter-spacing:.19em;color:var(--red)}h1{font:700 clamp(27px,3vw,47px)/1.13 Manrope;margin:35px 0 26px;letter-spacing:-.045em}p{font-size:clamp(14px,1.3vw,18px);line-height:1.7;max-width:420px}.pagefoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.12em;color:#999}.dark .pagefoot{color:#bbb}.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#777}.dark .tag{color:#ddd}.accent{font-size:11px;letter-spacing:.13em;color:var(--red);font-weight:700}.lines{margin-top:auto;height:30%;background:repeating-linear-gradient(140deg,transparent,transparent 22px,#d0d0cb 23px,#d0d0cb 24px);opacity:.35}.inside.dark .lines{opacity:.15}.controls{display:flex;align-items:center;justify-content:center;gap:20px;height:80px}.controls button,header button{border:1px solid #d5d4d0;background:white;padding:12px 17px;font:600 13px "DM Sans";cursor:pointer;border-radius:3px}.controls button:hover,header button:hover{border-color:var(--red);color:var(--red)}#count{min-width:90px;text-align:center;font-size:13px;color:#666}#toc{position:fixed;z-index:20;right:0;top:76px;width:min(380px,100%);height:calc(100vh - 76px);background:white;box-shadow:-15px 0 40px #0002;display:none;overflow:auto;padding:25px}#toc.open{display:block}#toc button{display:block;width:100%;text-align:left;padding:14px;border:0;border-bottom:1px solid #eee;background:white;cursor:pointer}.arrow{position:absolute;top:50%;transform:translateY(-50%);background:#fff;border:1px solid #ddd;border-radius:50%;width:43px;height:43px;cursor:pointer;font-size:21px}.arrow.prev{left:-54px}.arrow.next{right:-54px}.mobile-note{display:none}@media(max-width:700px){header{height:65px}.sub{display:none}.viewer{padding:16px 15px;min-height:calc(100vh - 135px)}.book{height:min(620px,calc(100vh - 155px));min-height:440px;width:min(450px,100%)}.sheet{width:100%;left:0!important;right:auto!important;border-radius:2px}.sheet.left{display:none}.sheet.right{transform-origin:left center}.inside{padding:30px}.kicker{margin-top:35px}h1{font-size:34px}.arrow{display:none}.mobile-note{display:block;font-size:11px;color:#777;text-align:center;padding-bottom:10px}#toc{top:65px;height:calc(100vh - 65px)}}@media(prefers-reduced-motion:reduce){.sheet{transition:none}}</style></head><body><header><div><div class="brand">SM<b>A</b>RT CONCEPT</div><div class="sub">Signature Architecture</div></div><button onclick="document.getElementById('toc').classList.toggle('open')">☰ Sommaire</button></header><aside id="toc"></aside><div class="viewer"><div class="book" id="book"><button class="arrow prev" onclick="go(-1)">‹</button><button class="arrow next" onclick="go(1)">›</button></div></div><div class="controls"><button onclick="go(-1)">← Précédent</button><span id="count"></span><button onclick="go(1)">Suivant →</button></div><div class="mobile-note">Touchez les boutons pour tourner les pages.</div><script>
const pages=[["SIGNATURE ARCHITECTURE","L’art de concevoir.<br>La maîtrise de réaliser.","Contractant général & maîtrise d’œuvre","couverture"],["NOTRE PHILOSOPHIE","Un projet.<br>Deux façons de le réussir.","Le bon niveau d’accompagnement, adapté à votre vision.","intro"],["SMART CONCEPT INTÉGRAL","Vous imaginez.<br>Nous réalisons.","Contractant général : un contrat de travaux avec Smart Concept, un prix global selon le périmètre convenu et une organisation intégrée.","cg"],["SMART CONCEPT PILOTAGE","Votre projet.<br>Vos entreprises.","Maîtrise d’œuvre : vous choisissez les entreprises, signez directement les marchés et bénéficiez de notre accompagnement technique selon la mission convenue.","moe"],["VOTRE LIBERTÉ","Pourquoi choisir<br>la maîtrise d’œuvre ?","Transparence des devis. Liberté de choix. Mise en concurrence. Accompagnement technique.","avantages"],["COMPRENDRE","Deux cadres.<br>Deux engagements.","En contractant général, Smart Concept facture les travaux. En maîtrise d’œuvre, chaque entreprise facture directement le client.","contrats"],["NOTRE MÉTHODE","De l’idée<br>à la réception.","01 Écouter · 02 Étudier · 03 Organiser · 04 Accompagner","methode"],["BUDGET","Un budget.<br>Deux organisations.","Exemple indicatif : 150 000 € HT en contrat global, ou 135 000 € HT de marchés et 15 000 € HT d’honoraires de maîtrise d’œuvre. Budget MOE prévisionnel.","budget"],["NOTRE ENGAGEMENT","Une exigence<br>à chaque étape.","Clarté des missions, méthode structurée et vision technique au service de votre projet.","engagement"],["NOTRE PRÉSENCE","Trois pays.<br>Une ambition.","France · Maroc · Tunisie. Des implantations et relais adaptés aux projets et aux prestations disponibles localement.","international"],["VOTRE CHOIX","La formule<br>qui vous ressemble.","Déléguer les travaux ? Contractant général. Garder le choix des entreprises ? Maîtrise d’œuvre.","choix"],["CONTACT","Donnons vie<br>à votre projet.","contact@groupesmartconcept.com","contact"]];let pos=0,animating=false;const book=document.getElementById('book'),toc=document.getElementById('toc');function mobile(){return innerWidth<=700}function page(i,side){if(i<0||i>=pages.length)return '';let a=pages[i];let theme=i===0||i===11?'dark':i%3===0?'photo':'';return '<div class="sheet '+side+'" data-index="'+i+'"><section class="inside '+theme+'"><div class="kicker">'+a[0]+'</div><h1>'+a[1]+'</h1><p>'+a[2]+'</p><div class="lines"></div><div class="pagefoot"><span>SMART CONCEPT / SIGNATURE ARCHITECTURE</span><span>'+String(i+1).padStart(2,'0')+' / 12</span></div></section></div>'}function render(){let m=mobile();book.querySelectorAll('.sheet').forEach(x=>x.remove());book.insertAdjacentHTML('beforeend',m?page(pos,'right'):page(pos,'left')+page(pos+1,'right'));document.getElementById('count').textContent=m?(pos+1)+' / 12':(pos+1)+'–'+Math.min(pos+2,12)+' / 12'}function go(dir){if(animating)return;let step=mobile()?1:2,next=Math.max(0,Math.min(mobile()?11:10,pos+dir*step));if(next===pos)return;animating=true;const leaf=book.querySelector(dir>0?'.sheet.right':'.sheet.left');if(leaf)leaf.classList.add(dir>0?'turn-left':'turn-right');setTimeout(()=>{pos=next;render();animating=false},450)}toc.innerHTML=pages.map((p,i)=>'<button onclick="pos='+i+';if(!mobile())pos-=pos%2;render();toc.classList.remove(\'open\')">'+String(i+1).padStart(2,'0')+' — '+p[0]+'</button>').join('');onkeydown=e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)};onresize=()=>{if(!mobile())pos-=pos%2;render()};render();
</script></body></html>
